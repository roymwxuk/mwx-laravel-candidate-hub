name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  laravel:
    name: Laravel (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Setup Python (for the extractor contract test)
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Start extractor service
        working-directory: extractor
        env:
          EXTRACTOR_TOKEN: ci-token
        run: |
          pip install -r requirements.txt
          nohup uvicorn app.main:app --port 8001 > /tmp/extractor.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/health && exit 0; sleep 1; done
          cat /tmp/extractor.log; exit 1

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        env:
          EXTRACTOR_INTEGRATION_URL: http://127.0.0.1:8001
          EXTRACTOR_INTEGRATION_TOKEN: ci-token
        run: php artisan test

  extractor:
    name: Extractor (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extractor
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    needs: [laravel, extractor]
    steps:
      - uses: actions/checkout@v5
      - name: Build and start
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: End-to-end smoke test (login → upload → queued extraction)
        run: docker/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
